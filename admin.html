<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Admin | EAGLE CONVERGENCE '26</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37; --gold-deep: #B8960C; --gold-light: #F5E6A3;
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 40%, #B8960C 100%);
            --bg: #FFFFFF; --surface: #FAFAFA; --text: #1A1A1A; --text-secondary: #5A5A5A;
            --success: #2E7D32; --error: #D32F2F; --warning: #E67E22;
            --radius: 16px; --radius-sm: 10px; --transition: 0.3s ease;
        }
        html { font-size: 16px; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0A0A0A; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 0; color: var(--text); }
        .app-container { width: 100%; max-width: 500px; min-height: 100vh; background: var(--bg); position: relative; overflow-x: hidden; overflow-y: auto; box-shadow: 0 0 80px rgba(212,175,55,0.3); }
        @media (min-width: 768px) { body { padding: 30px; } .app-container { border-radius: 28px; min-height: calc(100vh - 60px); max-height: 95vh; } }
        .app-container::-webkit-scrollbar { width: 4px; }
        .app-container::-webkit-scrollbar-track { background: transparent; }
        .app-container::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* LOGIN */
        .auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px; text-align: center; background: #0A0A0A; }
        .auth-screen .logo { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 16px; display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 900; font-family: 'Playfair Display', serif; font-size: 1.1rem; }
        .auth-screen h2 { font-family: 'Playfair Display', serif; color: #FFF; font-size: 1.2rem; margin-bottom: 2px; }
        .auth-screen .subtitle { color: var(--gold); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
        .auth-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .auth-form input { width: 100%; padding: 13px 16px; border-radius: var(--radius-sm); border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #FFF; font-size: 0.88rem; font-family: 'Inter', sans-serif; outline: none; transition: var(--transition); }
        .auth-form input::placeholder { color: rgba(255,255,255,0.3); }
        .auth-form input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); }
        .auth-error { color: #FF6B6B; font-size: 0.73rem; display: none; text-align: center; padding: 8px; background: rgba(211,47,47,0.1); border-radius: 8px; }
        .auth-error.show { display: block; }
        .auth-success { color: var(--success); font-size: 0.73rem; display: none; text-align: center; padding: 8px; background: rgba(46,125,50,0.1); border-radius: 8px; }
        .auth-success.show { display: block; }
        .btn-auth { width: 100%; padding: 13px; border: none; border-radius: 50px; font-weight: 700; font-size: 0.88rem; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--gold-gradient); color: #0A0A0A; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212,175,55,0.3); }
        .auth-toggle { color: rgba(255,255,255,0.5); font-size: 0.75rem; margin-top: 6px; }
        .auth-toggle span { color: var(--gold); cursor: pointer; font-weight: 600; text-decoration: underline; }

        /* DASHBOARD */
        .dashboard { display: none; padding-bottom: 40px; }
        .dashboard.show { display: block; }
        .admin-header { background: #0A0A0A; padding: 20px; text-align: center; position: relative; }
        .admin-header::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--gold-gradient); }
        .admin-header h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #FFF; letter-spacing: 1px; }
        .admin-header .admin-label { font-size: 0.6rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; text-transform: uppercase; }
        .admin-header .admin-email { font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .btn-logout { position: absolute; top: 16px; right: 16px; padding: 6px 14px; background: rgba(255,255,255,0.08); color: #FFF; border: 1px solid rgba(255,255,255,0.15); border-radius: 50px; font-size: 0.7rem; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-logout:hover { background: rgba(211,47,47,0.2); border-color: var(--error); }

        .day-selector { display: flex; gap: 8px; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .day-btn { flex: 1; padding: 12px 8px; border: 2px solid rgba(0,0,0,0.08); border-radius: var(--radius-sm); background: #FFF; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: var(--transition); text-align: center; font-family: 'Inter', sans-serif; }
        .day-btn.active { border-color: var(--gold); background: rgba(212,175,55,0.06); color: var(--gold-deep); box-shadow: 0 4px 20px rgba(212,175,55,0.15); }
        .day-btn .day-num { font-size: 1.2rem; display: block; }
        .day-btn .day-label { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); }

        .scanner-section { padding: 16px 20px; }
        .scanner-box { border-radius: var(--radius); overflow: hidden; border: 2px solid rgba(0,0,0,0.08); background: #0A0A0A; }
        #reader { width: 100%; }
        .scan-status { margin-top: 10px; padding: 12px 16px; border-radius: var(--radius-sm); text-align: center; font-weight: 700; font-size: 0.85rem; display: none; }
        .scan-status.show { display: block; animation: fadeIn 0.3s ease; }
        .scan-status.success { background: rgba(46,125,50,0.1); color: var(--success); border: 1px solid rgba(46,125,50,0.2); }
        .scan-status.error { background: rgba(211,47,47,0.1); color: var(--error); border: 1px solid rgba(211,47,47,0.2); }
        .scan-status.warning { background: rgba(230,126,34,0.1); color: var(--warning); border: 1px solid rgba(230,126,34,0.2); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .scanner-controls { display: flex; gap: 8px; margin-top: 10px; }
        .btn-scanner { flex: 1; padding: 10px; border-radius: 50px; border: none; font-weight: 600; font-size: 0.78rem; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-start { background: var(--gold-gradient); color: #0A0A0A; }
        .btn-stop { background: var(--surface); color: var(--text-secondary); border: 1px solid rgba(0,0,0,0.1); }
        .btn-scanner:disabled { opacity: 0.5; cursor: not-allowed; }

        .stats-row { display: flex; gap: 8px; padding: 0 20px 16px; }
        .stat-card { flex: 1; background: #FFF; border: 1px solid rgba(0,0,0,0.06); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
        .stat-card .stat-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; }
        .stat-card .stat-label { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); }
        .stat-card.gold { border-color: rgba(212,175,55,0.3); background: rgba(212,175,55,0.03); }
        .stat-card.gold .stat-num { color: var(--gold-deep); }

        .table-section { padding: 0 20px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .table-header h3 { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; }
        .table-controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm { padding: 8px 14px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.1); background: #FFF; font-size: 0.7rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-sm.primary { background: var(--gold-gradient); color: #0A0A0A; border: none; font-weight: 700; }
        .search-input { padding: 8px 14px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.1); font-size: 0.75rem; outline: none; font-family: 'Inter', sans-serif; width: 130px; }
        .search-input:focus { border-color: var(--gold); }
        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
        .attendee-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; background: #FFF; min-width: 500px; }
        .attendee-table th { background: #0A0A0A; color: #FFF; padding: 10px 8px; text-align: left; font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
        .attendee-table td { padding: 10px 8px; border-bottom: 1px solid rgba(0,0,0,0.04); white-space: nowrap; }
        .attendee-table tr:hover td { background: rgba(212,175,55,0.03); }
        .check-mark { cursor: pointer; font-size: 1.2rem; text-align: center; user-select: none; }
        .check-mark:hover { transform: scale(1.25); }
        .check-mark.checked { color: var(--success); }
        .check-mark.unchecked { color: #CCC; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #FFF; border-radius: var(--radius); padding: 24px 20px; width: 100%; max-width: 400px; }
        .modal h3 { font-family: 'Playfair Display', serif; margin-bottom: 14px; }
        .modal .form-group { margin-bottom: 10px; }
        .modal .form-group label { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; }
        .modal .form-group input { width: 100%; padding: 10px 12px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; }
        .modal .form-group input:focus { border-color: var(--gold); }
        .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 50px; border: none; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-save { background: var(--gold-gradient); color: #0A0A0A; }
        .btn-cancel { background: var(--surface); color: var(--text-secondary); border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- AUTH SCREEN -->
        <div class="auth-screen" id="authScreen">
            <div class="logo">SPAC</div>
            <h2>Admin Access</h2>
            <p class="subtitle">EAGLE CONVERGENCE '26</p>
            
            <div class="auth-form" id="loginForm">
                <input type="email" id="authEmail" placeholder="Email address" autocomplete="email">
                <input type="password" id="authPassword" placeholder="Password (min 6 characters)" autocomplete="current-password">
                <span class="auth-error" id="authError"></span>
                <span class="auth-success" id="authSuccess"></span>
                <button class="btn-auth btn-primary" onclick="handleLogin()">Sign In</button>
                <div class="auth-toggle">
                    Don't have an account? <span onclick="toggleAuthMode()">Create Account</span>
                </div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div class="dashboard" id="dashboard">
            <div class="admin-header">
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
                <div class="admin-label">Admin Dashboard</div>
                <h2>EAGLE CONVERGENCE '26</h2>
                <div class="admin-email" id="adminEmail"></div>
            </div>

            <div class="day-selector">
                <button class="day-btn active" onclick="selectDay('day1', this)"><span class="day-num">Day 1</span><span class="day-label">Thu 4th</span></button>
                <button class="day-btn" onclick="selectDay('day2', this)"><span class="day-num">Day 2</span><span class="day-label">Fri 5th</span></button>
                <button class="day-btn" onclick="selectDay('day3', this)"><span class="day-num">Day 3</span><span class="day-label">Sat 6th</span></button>
            </div>

            <div class="scanner-section">
                <div class="scanner-box"><div id="reader"></div></div>
                <div class="scan-status" id="scanStatus"></div>
                <div class="scanner-controls">
                    <button class="btn-scanner btn-start" onclick="startScanner()" id="btnStartScanner">📷 Start Scanner</button>
                    <button class="btn-scanner btn-stop" onclick="stopScanner()" id="btnStopScanner" disabled>⏹ Stop</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card"><div class="stat-num" id="statRegistered">0</div><div class="stat-label">Total</div></div>
                <div class="stat-card gold"><div class="stat-num" id="statPresent">0</div><div class="stat-label">Present</div></div>
                <div class="stat-card"><div class="stat-num" id="statAbsent">0</div><div class="stat-label">Absent</div></div>
            </div>

            <div class="table-section">
                <div class="table-header">
                    <h3>Attendees</h3>
                    <div class="table-controls">
                        <input type="text" class="search-input" placeholder="🔍 Search..." oninput="filterTable()" id="searchInput">
                        <button class="btn-sm primary" onclick="openWalkInModal()">+ Walk-In</button>
                        <button class="btn-sm" onclick="exportToExcel()">📥 Excel</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="attendee-table">
                        <thead><tr><th>Name</th><th>Ticket</th><th>Seat</th><th>D1</th><th>D2</th><th>D3</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="modal-overlay" id="walkInModal">
                <div class="modal">
                    <h3>➕ Add Walk-In Attendee</h3>
                    <div class="form-group"><label>Full Name</label><input type="text" id="walkInName" placeholder="Full name"></div>
                    <div class="form-group"><label>WhatsApp (optional)</label><input type="tel" id="walkInWhatsapp" placeholder="08012345678"></div>
                    <div class="modal-buttons">
                        <button class="btn-cancel" onclick="closeWalkInModal()">Cancel</button>
                        <button class="btn-save" onclick="addWalkIn()">Add Attendee</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, setDoc, getDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvUeEnc2mtjw9Umhjh7qVls7tzTKgj2Pw",
            authDomain: "eagle-ec67f.firebaseapp.com",
            projectId: "eagle-ec67f",
            storageBucket: "eagle-ec67f.firebasestorage.app",
            messagingSenderId: "751509177511",
            appId: "1:751509177511:web:91adcd50595210cb80c782"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentDay = 'day1';
        let currentDayLabel = 'Day1';
        let html5QrCode = null;
        let allAttendees = [];
        let isScannerRunning = false;
        let isSignUpMode = false;

        // ============ AUTH STATE LISTENER ============
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashboard').classList.add('show');
                document.getElementById('adminEmail').textContent = user.email;
                loadAttendees();
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('dashboard').classList.remove('show');
            }
        });

        // ============ AUTH MODE TOGGLE ============
        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            const btn = document.querySelector('.btn-primary');
            const toggleText = document.querySelector('.auth-toggle span');
            const title = document.querySelector('.auth-screen h2');
            const subtitle = document.querySelector('.auth-screen .subtitle');
            
            if (isSignUpMode) {
                title.textContent = 'Create Admin Account';
                subtitle.textContent = 'Register as an admin';
                btn.textContent = 'Create Account';
                toggleText.textContent = 'Already have an account? Sign In';
            } else {
                title.textContent = 'Admin Access';
                subtitle.textContent = 'EAGLE CONVERGENCE \'26';
                btn.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account? Create Account";
            }
            hideMessages();
        };

        function hideMessages() {
            document.getElementById('authError').classList.remove('show');
            document.getElementById('authSuccess').classList.remove('show');
        }

        // ============ LOGIN / SIGNUP ============
        window.handleLogin = async function() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errorEl = document.getElementById('authError');
            const successEl = document.getElementById('authSuccess');
            
            hideMessages();
            
            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.classList.add('show');
                return;
            }
            
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.classList.add('show');
                return;
            }
            
            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    successEl.textContent = '✅ Account created successfully!';
                    successEl.classList.add('show');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered. Sign in instead.';
                if (error.code === 'auth/invalid-email') msg = 'Invalid email format.';
                if (error.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 6 characters.';
                if (error.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
                if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                if (error.code === 'auth/network-request-failed') msg = 'Network error. Check your internet connection.';
                errorEl.textContent = msg;
                errorEl.classList.add('show');
            }
        };

        window.handleLogout = async function() {
            await signOut(auth);
        };

        document.getElementById('authPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // ============ DAY SELECTION ============
        window.selectDay = function(day, btn) {
            currentDay = day;
            currentDayLabel = 'Day' + day.slice(-1);
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (isScannerRunning) { stopScanner(); setTimeout(startScanner, 500); }
            updateStats();
        };

        // ============ SCANNER ============
        window.startScanner = async function() {
            if (isScannerRunning) return;
            document.getElementById('btnStartScanner').disabled = true;
            document.getElementById('btnStopScanner').disabled = false;
            const statusDiv = document.getElementById('scanStatus');
            statusDiv.className = 'scan-status warning show';
            statusDiv.textContent = '📷 Starting camera...';
            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    () => {}
                );
                isScannerRunning = true;
                statusDiv.textContent = '📷 Ready — point at ticket QR code';
            } catch (err) {
                statusDiv.className = 'scan-status error show';
                statusDiv.textContent = '❌ Camera error: ' + err.message;
                document.getElementById('btnStartScanner').disabled = false;
                document.getElementById('btnStopScanner').disabled = true;
            }
        };

        window.stopScanner = async function() {
            if (html5QrCode && isScannerRunning) {
                try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e) {}
                isScannerRunning = false;
            }
            document.getElementById('btnStartScanner').disabled = false;
            document.getElementById('btnStopScanner').disabled = true;
            document.getElementById('scanStatus').className = 'scan-status';
            document.getElementById('scanStatus').textContent = '';
        };

        async function onScanSuccess(decodedText) {
            const ticketId = decodedText.trim();
            const statusDiv = document.getElementById('scanStatus');
            const attendanceField = 'attendance' + currentDayLabel;
            
            const q = query(collection(db, 'attendees'), where('ticketId', '==', ticketId));
            const snapshot = await getDocs(q);
            
            if (snapshot.empty) {
                statusDiv.className = 'scan-status error show';
                statusDiv.textContent = `❌ Ticket "${ticketId}" not found`;
                playBeep('error');
                return;
            }
            
            const docData = snapshot.docs[0];
            const data = docData.data();
            
            if (data[attendanceField] === true) {
                statusDiv.className = 'scan-status warning show';
                statusDiv.textContent = `⚠️ ${data.fullName} already marked present`;
                playBeep('warning');
                return;
            }
            
            await updateDoc(docData.ref, {
                [attendanceField]: true,
                [`markedAt_${attendanceField}`]: serverTimestamp()
            });
            
            statusDiv.className = 'scan-status success show';
            statusDiv.textContent = `✅ ${data.fullName} — PRESENT (Seat ${data['seat'+currentDayLabel] || 'N/A'})`;
            playBeep('success');
            loadAttendees();
        }

        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                g.gain.value = 0.06;
                o.frequency.value = type === 'success' ? 880 : type === 'warning' ? 500 : 300;
                o.start(); o.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // ============ TABLE ============
        window.toggleAttendance = async function(docId, day) {
            const field = 'attendance' + day;
            const attendee = allAttendees.find(a => a.id === docId);
            if (!attendee) return;
            const newVal = !attendee[field];
            await updateDoc(doc(db, 'attendees', docId), {
                [field]: newVal,
                [`markedAt_${field}`]: newVal ? serverTimestamp() : null
            });
            attendee[field] = newVal;
            renderTable(allAttendees);
            updateStats();
        };

        async function loadAttendees() {
            const snap = await getDocs(query(collection(db, 'attendees'), orderBy('registeredAt', 'desc')));
            allAttendees = [];
            snap.forEach(d => allAttendees.push({ id: d.id, ...d.data() }));
            renderTable(allAttendees);
            updateStats();
        }

        function renderTable(list) {
            const s = (document.getElementById('searchInput').value || '').toLowerCase();
            const filtered = list.filter(a => !s || (a.fullName||'').toLowerCase().includes(s) || (a.ticketId||'').toLowerCase().includes(s));
            document.getElementById('tableBody').innerHTML = filtered.map(a => {
                const seat = a['seat'+currentDayLabel] || '—';
                return `<tr>
                    <td><strong>${a.fullName||'—'}</strong></td>
                    <td>${a.ticketId||'—'}</td><td>${seat}</td>
                    <td class="check-mark ${a.attendanceDay1?'checked':'unchecked'}" onclick="toggleAttendance('${a.id}','Day1')">${a.attendanceDay1?'✅':'❌'}</td>
                    <td class="check-mark ${a.attendanceDay2?'checked':'unchecked'}" onclick="toggleAttendance('${a.id}','Day2')">${a.attendanceDay2?'✅':'❌'}</td>
                    <td class="check-mark ${a.attendanceDay3?'checked':'unchecked'}" onclick="toggleAttendance('${a.id}','Day3')">${a.attendanceDay3?'✅':'❌'}</td>
                </tr>`;
            }).join('');
        }

        window.filterTable = () => renderTable(allAttendees);

        function updateStats() {
            const f = 'attendance' + currentDayLabel;
            const t = allAttendees.length;
            const p = allAttendees.filter(a => a[f] === true).length;
            document.getElementById('statRegistered').textContent = t;
            document.getElementById('statPresent').textContent = p;
            document.getElementById('statAbsent').textContent = t - p;
        }

        // ============ WALK-IN ============
        window.openWalkInModal = () => document.getElementById('walkInModal').classList.add('show');
        window.closeWalkInModal = () => {
            document.getElementById('walkInModal').classList.remove('show');
            document.getElementById('walkInName').value = '';
            document.getElementById('walkInWhatsapp').value = '';
        };
        window.addWalkIn = async function() {
            const name = document.getElementById('walkInName').value.trim();
            const wa = document.getElementById('walkInWhatsapp').value.trim() || 'walk-in';
            if (!name) return alert('Please enter a name');
            
            const cr = doc(db, 'counters', 'ticketCounter');
            const cs = await getDoc(cr);
            let nv = 1;
            if (cs.exists()) nv = (cs.data().value || 0) + 1;
            await setDoc(cr, { value: nv }, { merge: true });
            
            const sr = doc(db, 'counters', 'seatCounters');
            const ss = await getDoc(sr);
            let se = { day1: 0, day2: 0, day3: 0 };
            if (ss.exists()) se = ss.data();
            const s1 = (se.day1 || 0) + 1, s2 = (se.day2 || 0) + 1, s3 = (se.day3 || 0) + 1;
            await setDoc(sr, { day1: s1, day2: s2, day3: s3 }, { merge: true });
            
            await addDoc(collection(db, 'attendees'), {
                fullName: name, whatsapp: wa, birthday: '',
                ticketId: `EAG-${String(nv).padStart(4, '0')}`,
                seatDay1: String(s1).padStart(3, '0'),
                seatDay2: String(s2).padStart(3, '0'),
                seatDay3: String(s3).padStart(3, '0'),
                attendanceDay1: currentDay === 'day1',
                attendanceDay2: currentDay === 'day2',
                attendanceDay3: currentDay === 'day3',
                programName: 'EAGLE CONVERGENCE', church: 'SPAC CHURCH',
                hostPastor: 'Yomi Okewunmi',
                registeredAt: serverTimestamp(), isWalkIn: true
            });
            
            closeWalkInModal();
            loadAttendees();
            alert(`✅ Walk-in added! Ticket: EAG-${String(nv).padStart(4, '0')}`);
        };

        // ============ EXPORT ============
        window.exportToExcel = function() {
            let csv = 'Name,Phone,Ticket ID,Seat D1,Seat D2,Seat D3,Day1,Day2,Day3\n';
            allAttendees.forEach(a => {
                csv += `"${a.fullName||''}","${a.whatsapp||''}","${a.ticketId||''}","${a.seatDay1||''}","${a.seatDay2||''}","${a.seatDay3||''}",${a.attendanceDay1?'Present':'Absent'},${a.attendanceDay2?'Present':'Absent'},${a.attendanceDay3?'Present':'Absent'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `eagle-convergence-attendance-${currentDayLabel.toLowerCase()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
