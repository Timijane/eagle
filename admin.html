        import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, setDoc, getDoc, serverTimestamp, orderBy, onSnapshot, runTransaction, increment } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvUeEnc2mtjw9Umhjh7qVls7tzTKgj2Pw",
            authDomain: "eagle-ec67f.firebaseapp.com",
            projectId: "eagle-ec67f",
            storageBucket: "eagle-ec67f.firebasestorage.app",
            messagingSenderId: "751509177511",
            appId: "1:751509177511:web:91adcd50595210cb80c782"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const authScreen = document.getElementById('authScreen');
        const dashboard = document.getElementById('dashboard');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authError = document.getElementById('authError');
        const authSuccess = document.getElementById('authSuccess');
        const authBtn = document.getElementById('authBtn');
        const toggleAuthLink = document.getElementById('toggleAuthLink');
        const adminEmailDisplay = document.getElementById('adminEmail');
        const btnLogout = document.getElementById('btnLogout');
        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const dayButtons = document.querySelectorAll('.day-btn');
        const btnStartScanner = document.getElementById('btnStartScanner');
        const btnStopScanner = document.getElementById('btnStopScanner');
        const manualTicketInput = document.getElementById('manualTicketInput');
        const btnManualScan = document.getElementById('btnManualScan');
        const scanStatus = document.getElementById('scanStatus');
        const statRegistered = document.getElementById('statRegistered');
        const statPresent = document.getElementById('statPresent');
        const statAbsent = document.getElementById('statAbsent');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const btnWalkIn = document.getElementById('btnWalkIn');
        const walkInModal = document.getElementById('walkInModal');
        const cancelWalkIn = document.getElementById('cancelWalkIn');
        const saveWalkIn = document.getElementById('saveWalkIn');
        const walkInName = document.getElementById('walkInName');
        const walkInWhatsapp = document.getElementById('walkInWhatsapp');
        const btnExport = document.getElementById('btnExport');
        const btnGroupInvite = document.getElementById('btnGroupInvite');
        const groupLinkInput = document.getElementById('groupLinkInput');
        const btnSaveGroupLink = document.getElementById('btnSaveGroupLink');
        const btnEditGroupLink = document.getElementById('btnEditGroupLink');
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmCancel = document.getElementById('confirmCancel');
        const confirmOk = document.getElementById('confirmOk');
        const toastContainer = document.getElementById('toastContainer');

        let currentDay = 'day1', currentDayLabel = 'Day1', html5QrCode = null, allAttendees = [], isScannerRunning = false, isSignUpMode = false, lastScanAction = null, unsubscribe = null, sortColumn = null, sortDirection = 'asc', confirmCallback = null, groupInviteLink = '';

        function formatWhatsAppNumber(phone) {
            if (!phone) return null;
            const cleaned = phone.replace(/\D/g, '');
            if (!cleaned) return null;
            if (phone.startsWith('+')) return cleaned;
            if (cleaned.startsWith('234') && cleaned.length >= 10) return cleaned;
            if (cleaned.startsWith('0') && cleaned.length >= 10) return '234' + cleaned.substring(1);
            return cleaned;
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.style.display = 'none';
                dashboard.classList.add('show');
                dashboard.setAttribute('aria-hidden', 'false');
                adminEmailDisplay.textContent = user.email;
                loadGroupLink();
                startRealtimeListener();
            } else {
                authScreen.style.display = 'flex';
                dashboard.classList.remove('show');
                dashboard.setAttribute('aria-hidden', 'true');
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            }
        });

        toggleAuthLink.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            document.querySelector('.auth-screen h2').textContent = isSignUpMode ? 'Create Admin Account' : 'Admin Access';
            document.querySelector('.auth-screen .subtitle').textContent = isSignUpMode ? 'Register as an admin' : "EAGLES' CONVERGENCE '26";
            authBtn.textContent = isSignUpMode ? 'Create Account' : 'Sign In';
            toggleAuthLink.textContent = isSignUpMode ? 'Already have an account? Sign In' : "Don't have an account? Create Account";
            authError.classList.remove('show');
            authSuccess.classList.remove('show');
        });

        authBtn.addEventListener('click', async () => {
            const email = authEmail.value.trim();
            const password = authPassword.value;
            authError.classList.remove('show');
            authSuccess.classList.remove('show');
            if (!email || !password) { authError.textContent = 'Please fill in all fields'; authError.classList.add('show'); return; }
            if (password.length < 6) { authError.textContent = 'Password must be at least 6 characters'; authError.classList.add('show'); return; }
            authBtn.disabled = true;
            authBtn.textContent = 'Processing...';
            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    authSuccess.textContent = '✅ Account created successfully!';
                    authSuccess.classList.add('show');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
                if (error.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
                authError.textContent = msg;
                authError.classList.add('show');
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isSignUpMode ? 'Create Account' : 'Sign In';
            }
        });
        authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') authBtn.click(); });
        btnLogout.addEventListener('click', () => signOut(auth));

        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark-mode', dark);
            btnThemeToggle.textContent = dark ? '☀️' : '🌓';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));
        btnThemeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark-mode');
            applyTheme(!isDark);
        });

        dayButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentDay = btn.dataset.day;
                currentDayLabel = 'Day' + currentDay.slice(-1);
                dayButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (isScannerRunning) { stopScanner(); setTimeout(startScanner, 500); }
                updateStats();
            });
        });

        async function startScanner() {
            if (isScannerRunning) return;
            btnStartScanner.disabled = true;
            btnStopScanner.disabled = false;
            scanStatus.className = 'scan-status warning show';
            scanStatus.textContent = '📷 Starting camera...';
            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, () => {});
                isScannerRunning = true;
                scanStatus.textContent = '📷 Ready — point at ticket QR code';
            } catch (err) {
                scanStatus.className = 'scan-status error show';
                scanStatus.textContent = '❌ Camera error: ' + (err.message || 'Permission denied.');
                btnStartScanner.disabled = false;
                btnStopScanner.disabled = true;
            }
        }
        async function stopScanner() {
            if (html5QrCode && isScannerRunning) { try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e) {} isScannerRunning = false; }
            btnStartScanner.disabled = false;
            btnStopScanner.disabled = true;
            scanStatus.className = 'scan-status';
            scanStatus.innerHTML = '';
            lastScanAction = null;
        }
        btnStartScanner.addEventListener('click', startScanner);
        btnStopScanner.addEventListener('click', stopScanner);

        btnManualScan.addEventListener('click', () => {
            const ticketId = manualTicketInput.value.trim();
            if (ticketId) { onScanSuccess(ticketId, true); manualTicketInput.value = ''; }
        });
        manualTicketInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnManualScan.click(); });

        async function onScanSuccess(decodedText, isManual = false) {
            const ticketId = decodedText.trim();
            const attendanceField = 'attendance' + currentDayLabel;
            const q = query(collection(db, 'attendees'), where('ticketId', '==', ticketId));
            const snapshot = await getDocs(q);
            if (snapshot.empty) {
                scanStatus.className = 'scan-status error show';
                scanStatus.innerHTML = `❌ Ticket "${ticketId}" not found`;
                playBeep('error');
                autoClearStatus(3000);
                return;
            }
            const docData = snapshot.docs[0];
            const data = docData.data();
            if (data[attendanceField] === true) {
                scanStatus.className = 'scan-status warning show';
                scanStatus.innerHTML = `⚠️ ${data.fullName} already marked present`;
                playBeep('warning');
                autoClearStatus(3000);
                return;
            }
            await updateDoc(docData.ref, { [attendanceField]: true, [`markedAt_${attendanceField}`]: serverTimestamp() });
            lastScanAction = { docId: docData.id, field: attendanceField, name: data.fullName };
            scanStatus.className = 'scan-status success show';
            scanStatus.innerHTML = `✅ ${data.fullName} — PRESENT (Seat ${data['seat'+currentDayLabel] || 'N/A'}) <button class="undo-btn" id="undoScanBtn">Undo</button>`;
            playBeep('success');
            setTimeout(() => {
                const undoBtn = document.getElementById('undoScanBtn');
                if (undoBtn) undoBtn.addEventListener('click', async () => {
                    if (lastScanAction) {
                        await updateDoc(doc(db, 'attendees', lastScanAction.docId), { [lastScanAction.field]: false });
                        showToast(`Attendance for ${lastScanAction.name} reverted.`, 'warning');
                        lastScanAction = null;
                        scanStatus.className = 'scan-status';
                        scanStatus.innerHTML = '';
                        loadAttendees();
                    }
                });
            }, 100);
            setTimeout(() => { if (lastScanAction && lastScanAction.docId === docData.id) { lastScanAction = null; scanStatus.className = 'scan-status'; scanStatus.innerHTML = ''; } }, 5000);
        }
        function autoClearStatus(delay) { setTimeout(() => { if (!lastScanAction) { scanStatus.className = 'scan-status'; scanStatus.innerHTML = ''; } }, delay); }
        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                g.gain.value = 0.06;
                o.frequency.value = type === 'success' ? 880 : type === 'warning' ? 500 : 300;
                o.start(); o.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function startRealtimeListener() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, 'attendees'), orderBy('registeredAt', 'desc'));
            unsubscribe = onSnapshot(q, (snapshot) => {
                allAttendees = [];
                snapshot.forEach(doc => allAttendees.push({ id: doc.id, ...doc.data() }));
                renderTable();
                updateStats();
            }, (error) => showToast('Error loading attendees', 'error'));
        }
        function loadAttendees() { startRealtimeListener(); }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            let filtered = allAttendees.filter(a => !searchTerm || (a.fullName||'').toLowerCase().includes(searchTerm) || (a.ticketId||'').toLowerCase().includes(searchTerm));
            if (sortColumn) {
                filtered.sort((a,b) => {
                    let va = a[sortColumn] ?? '', vb = b[sortColumn] ?? '';
                    if (typeof va === 'string') va = va.toLowerCase();
                    if (typeof vb === 'string') vb = vb.toLowerCase();
                    return (va < vb ? -1 : va > vb ? 1 : 0) * (sortDirection === 'asc' ? 1 : -1);
                });
            }
            if (filtered.length === 0) { tableBody.innerHTML = ''; emptyState.style.display = 'block'; }
            else {
                emptyState.style.display = 'none';
                tableBody.innerHTML = filtered.map(a => {
                    const seat = a['seat'+currentDayLabel] || '—';
                    const wa = a.whatsapp || '';
                    const formattedWa = formatWhatsAppNumber(wa);
                    const waLink = formattedWa ? `<a class="whatsapp-link" href="https://wa.me/${formattedWa}" target="_blank" title="Chat on WhatsApp">💬</a>` : '';
                    return `<tr>
                        <td><strong>${a.fullName||'—'}</strong>${waLink}</td>
                        <td>${a.ticketId||'—'}</td><td>${seat}</td>
                        <td class="check-mark ${a.attendanceDay1?'checked':'unchecked'}" data-id="${a.id}" data-field="attendanceDay1">${a.attendanceDay1?'✅':'❌'}</td>
                        <td class="check-mark ${a.attendanceDay2?'checked':'unchecked'}" data-id="${a.id}" data-field="attendanceDay2">${a.attendanceDay2?'✅':'❌'}</td>
                        <td class="check-mark ${a.attendanceDay3?'checked':'unchecked'}" data-id="${a.id}" data-field="attendanceDay3">${a.attendanceDay3?'✅':'❌'}</td>
                        <td>${formattedWa ? `<a href="https://wa.me/${formattedWa}" target="_blank" class="whatsapp-link">Chat</a>` : '—'}</td>
                    </tr>`;
                }).join('');
            }
            document.querySelectorAll('.check-mark').forEach(cell => {
                cell.addEventListener('click', () => {
                    const docId = cell.dataset.id, field = cell.dataset.field;
                    const attendee = allAttendees.find(a => a.id === docId);
                    if (!attendee) return;
                    const newVal = !attendee[field];
                    confirmTitle.textContent = 'Confirm Attendance Change';
                    confirmMessage.textContent = `Are you sure you want to mark ${attendee.fullName} as ${newVal ? 'Present' : 'Absent'} for Day ${field.slice(-1)}?`;
                    confirmCallback = async () => {
                        await updateDoc(doc(db, 'attendees', docId), { [field]: newVal, [`markedAt_${field}`]: newVal ? serverTimestamp() : null });
                        showToast(`${attendee.fullName} marked ${newVal ? 'Present' : 'Absent'}`, 'success');
                    };
                    confirmModal.classList.add('show');
                });
            });
        }

        document.querySelectorAll('.attendee-table th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const col = th.dataset.sort;
                if (sortColumn === col) sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                else { sortColumn = col; sortDirection = 'asc'; }
                document.querySelectorAll('.sort-icon').forEach(icon => icon.textContent = '');
                th.querySelector('.sort-icon').textContent = sortDirection === 'asc' ? '▲' : '▼';
                renderTable();
            });
        });

        let debounceTimer;
        searchInput.addEventListener('input', () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(renderTable, 300); });
        searchClear.addEventListener('click', () => { searchInput.value = ''; renderTable(); searchInput.focus(); });

        function updateStats() {
            const field = 'attendance' + currentDayLabel;
            const total = allAttendees.length;
            const present = allAttendees.filter(a => a[field] === true).length;
            statRegistered.textContent = total;
            statPresent.textContent = present;
            statAbsent.textContent = total - present;
        }

        btnWalkIn.addEventListener('click', () => { walkInModal.classList.add('show'); walkInName.focus(); });
        cancelWalkIn.addEventListener('click', () => { walkInModal.classList.remove('show'); walkInName.value = ''; walkInWhatsapp.value = ''; });
        saveWalkIn.addEventListener('click', async () => {
            const name = walkInName.value.trim();
            const wa = walkInWhatsapp.value.trim() || '';
            if (!name) { showToast('Please enter a name', 'error'); return; }
            try {
                const ticketCounterRef = doc(db, 'counters', 'ticketCounter');
                const newTicketNumber = await runTransaction(db, async (tx) => {
                    const ticketDoc = await tx.get(ticketCounterRef);
                    let n = (ticketDoc.exists() ? ticketDoc.data().value : 0) + 1;
                    tx.set(ticketCounterRef, { value: n }, { merge: true });
                    return n;
                });
                const seatCounterRef = doc(db, 'counters', 'seatCounters');
                const seatSnap = await getDoc(seatCounterRef);
                const seats = seatSnap.data() || { day1: 0, day2: 0, day3: 0 };
                const s1 = (seats.day1||0)+1, s2 = (seats.day2||0)+1, s3 = (seats.day3||0)+1;
                await setDoc(seatCounterRef, { day1: s1, day2: s2, day3: s3 }, { merge: true });
                await addDoc(collection(db, 'attendees'), {
                    fullName: name, whatsapp: wa, birthday: '',
                    ticketId: `EAG-${String(newTicketNumber).padStart(4,'0')}`,
                    seatDay1: String(s1).padStart(3,'0'), seatDay2: String(s2).padStart(3,'0'), seatDay3: String(s3).padStart(3,'0'),
                    attendanceDay1: currentDay==='day1', attendanceDay2: currentDay==='day2', attendanceDay3: currentDay==='day3',
                    programName: `EAGLES' CONVERGENCE`, church: 'SPAC CHURCH', hostPastor: 'Yomi Okewunmi',
                    registeredAt: serverTimestamp(), isWalkIn: true
                });
                walkInModal.classList.remove('show');
                walkInName.value = ''; walkInWhatsapp.value = '';
                showToast(`Walk-in added! Ticket: EAG-${String(newTicketNumber).padStart(4,'0')}`, 'success');
            } catch(e) { showToast('Error adding walk-in: '+e.message, 'error'); }
        });

        async function loadGroupLink() {
            try {
                const snap = await getDoc(doc(db, 'settings', 'groupInviteLink'));
                if (snap.exists()) { groupInviteLink = snap.data().url || ''; groupLinkInput.value = groupInviteLink; }
            } catch(e) { showToast('Could not load group link', 'error'); }
        }
        btnEditGroupLink.addEventListener('click', () => {
            groupLinkInput.style.display = 'inline-block'; btnSaveGroupLink.style.display = 'inline-block';
            btnEditGroupLink.style.display = 'none'; groupLinkInput.focus();
        });
        btnSaveGroupLink.addEventListener('click', async () => {
            const url = groupLinkInput.value.trim();
            if (!url) { showToast('Please enter a valid link', 'warning'); return; }
            await setDoc(doc(db, 'settings', 'groupInviteLink'), { url }, { merge: true });
            groupInviteLink = url;
            showToast('Group link saved!', 'success');
            groupLinkInput.style.display = 'none'; btnSaveGroupLink.style.display = 'none'; btnEditGroupLink.style.display = 'inline-block';
        });
        btnGroupInvite.addEventListener('click', () => {
            if (groupInviteLink) window.open(groupInviteLink, '_blank');
            else showToast('No group link set. Click ✏️ Set Link to add one.', 'warning');
        });

        confirmCancel.addEventListener('click', () => { confirmModal.classList.remove('show'); confirmCallback = null; });
        confirmOk.addEventListener('click', async () => { if (confirmCallback) await confirmCallback(); confirmModal.classList.remove('show'); confirmCallback = null; });

        btnExport.addEventListener('click', () => {
            const data = allAttendees.map(a => ({
                Name: a.fullName || '', Phone: a.whatsapp || '', 'Ticket ID': a.ticketId || '',
                'Seat D1': a.seatDay1||'', 'Seat D2': a.seatDay2||'', 'Seat D3': a.seatDay3||'',
                Day1: a.attendanceDay1?'Present':'Absent', Day2: a.attendanceDay2?'Present':'Absent', Day3: a.attendanceDay3?'Present':'Absent'
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
            XLSX.writeFile(wb, `eagles-convergence-${currentDayLabel.toLowerCase()}.xlsx`);
            showToast('Excel downloaded', 'success');
        });
    </script>

    <!-- Inline Service Worker (caches only the page shell, skips Firebase) -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `const CACHE='ec26-v5';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']))));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(u.hostname.includes('firestore')||u.hostname.includes('firebaseauth')||u.hostname.includes('identitytoolkit')||u.hostname.includes('unpkg')||u.hostname.includes('fonts')||u.hostname.includes('cloudinary'))return;e.respondWith(fetch(e.request).then(r=>{const cl=r.clone();caches.open(CACHE).then(c=>c.put(e.request,cl));return r;}).catch(()=>caches.match(e.request)))});`;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            window.addEventListener('load', () => navigator.serviceWorker.register(swUrl).catch(console.error));
        }
    </script>
</body>
